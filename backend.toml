# SPDX-License-Identifier: GPL-3.0-only
#:schema https://jorge-menjivar.github.io/super-voice/backend.schema.json
# Mistral backend configuration. See docs/protocol/backend/config.md.

[backend]
  # The id names the install directory. An install under the old id,
  # app.super-stt.mistral, moves to this one on update, because the daemon
  # finds it by `source`.
  id          = "app.super-voice.mistral"
  # The repository's old name, which GitHub redirects. `source` is the
  # backend's identity: installed copies find their updates by it, and the
  # user's settings, API key and selected model are named by it.
  source      = "github.com/jorge-menjivar/super-stt-mistral"
  name        = "Mistral"
  version     = "0.3.0"
  kind        = "wasm"
  entrypoint  = "mistral.wasm"
  product     = "super-voice"
  # v4 for text to speech: `role = "synthesis"`, its model keys and
  # `POST /v1/synthesize`. It needs Super Voice 0.3.0.
  contract    = "v4"
  license     = "GPL-3.0-only"
  description = "Cloud speech-to-text and text-to-speech via the Mistral (Voxtral) API."

[network]
  allowed_hosts = ["api.mistral.ai"]

[capabilities]
  websocket = true

  # Speech to text. Opts into being handed the user's dictation context as
  # `x-voice-prompt` and `x-voice-vocabulary`. Both go to Mistral as
  # `context_bias` entries, the terms and then the prompt, on recordings and on
  # realtime sessions.
  context   = true

[assets]
  wasm = "mistral.wasm"

[[secrets]]
  name        = "mistral_api_key"
  label       = "Mistral API key"
  description = "Used to authenticate requests to api.mistral.ai."
  required    = true

# Mistral's transcription models, Voxtral Transcribe 3. The Voxtral Transcribe 2
# models this backend offered before, voxtral-mini-latest and
# voxtral-mini-transcribe-realtime-2602, are deprecated and retire on
# 2027-04-30.
[[models]]
  name                = "voxtral-mini-transcribe-3"
  role                = "transcription"
  provider            = "mistral"
  multilingual        = true
  primary_language    = "en"
  supported_languages = [
    "en",
    "zh",
    "hi",
    "es",
    "ar",
    "fr",
    "pt",
    "ru",
    "de",
    "ja",
    "ko",
    "it",
    "nl"
  ]
  supported_devices   = ["none"]

[[models]]
  name                = "voxtral-small-transcribe-3"
  role                = "transcription"
  provider            = "mistral"
  multilingual        = true
  primary_language    = "en"
  supported_languages = [
    "en",
    "zh",
    "hi",
    "es",
    "ar",
    "fr",
    "pt",
    "ru",
    "de",
    "ja",
    "ko",
    "it",
    "nl"
  ]
  supported_devices   = ["none"]

[[models]]
  name                = "voxtral-mini-transcribe-realtime-3"
  role                = "transcription"
  provider            = "mistral"
  multilingual        = true
  primary_language    = "en"
  supported_languages = [
    "en",
    "zh",
    "hi",
    "es",
    "ar",
    "fr",
    "pt",
    "ru",
    "de",
    "ja",
    "ko",
    "it",
    "nl"
  ]
  supported_devices   = ["none"]
  realtime            = true

# Voxtral TTS 3. Mistral streams it as 24 kHz mono float PCM, which the
# component passes on as it arrives. The voice decides the language: the API
# takes no language, so the setting only says what the text is in. Any voice
# reads any of these languages.
#
# `max_input_chars` keeps one answer well under the daemon's 32 MiB: 2000
# characters are about two minutes of speech, 12 MB of float PCM. Mistral
# starts streaming about 2.5 s in however long the text is, so a larger chunk
# costs no latency, and the daemon already sends a short first one.
[[models]]
  name                = "voxtral-mini-tts-3"
  role                = "synthesis"
  multilingual        = true
  primary_language    = "en"
  supported_languages = [
    "en",
    "ar",
    "bg",
    "ca",
    "cs",
    "da",
    "de",
    "el",
    "es",
    "fi",
    "fil",
    "fr",
    "hi",
    "hr",
    "hu",
    "id",
    "is",
    "it",
    "ja",
    "ko",
    "lb",
    "lv",
    "nl",
    "no",
    "pl",
    "pt",
    "ro",
    "ru",
    "sk",
    "sl",
    "sv",
    "ta",
    "th",
    "tr",
    "uk",
    "ur",
    "vi",
    "zh"
  ]
  supported_devices   = ["none"]
  max_input_chars     = 2000
  output_sample_rate  = 24000
  default_voice       = "voice_478"
  # A cloned voice goes to Mistral as its reference clip, with every
  # synthesis in it, and Mistral keeps nothing of it. In between, the backend
  # keeps the clip in the private /tmp the daemon gives it, which is in memory
  # and removed when the model unloads. Mistral takes up to 30 s; 15 s cost no
  # latency over a preset voice when measured, and keep each request near 1 MB.
  voice_kinds         = ["preset", "cloned"]
  clone_ref_seconds   = 15.0

