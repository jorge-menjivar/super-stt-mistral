# SPDX-License-Identifier: GPL-3.0-only
#:schema https://jorge-menjivar.github.io/super-voice/backend.schema.json
# Mistral backend configuration. See docs/protocol/backend/config.md.

[backend]
  id          = "app.super-stt.mistral"
  source      = "github.com/jorge-menjivar/super-stt-mistral"
  name        = "Mistral"
  version     = "0.1.1"
  kind        = "wasm"
  entrypoint  = "mistral.wasm"
  product     = "super-voice"
  contract    = "v1"
  license     = "GPL-3.0-only"
  description = "Cloud speech-to-text via the Mistral (Voxtral) API."

[network]
  allowed_hosts = ["api.mistral.ai"]

[capabilities]
  websocket = true

[assets]
  wasm = "mistral.wasm"

[[secrets]]
  name        = "mistral_api_key"
  label       = "Mistral API key"
  description = "Used to authenticate requests to api.mistral.ai."
  required    = true

[[models]]
  name                = "voxtral-mini-latest"
  role                = "transcription"
  provider            = "mistral"
  multilingual        = true
  primary_language    = "en"
  supported_languages = [
    "en",
    "zh",
    "hi",
    "es",
    "ar",
    "fr",
    "pt",
    "ru",
    "de",
    "ja",
    "ko",
    "it",
    "nl"
  ]
  supported_devices   = ["none"]

[[models]]
  name                = "voxtral-mini-transcribe-realtime-2602"
  role                = "transcription"
  provider            = "mistral"
  multilingual        = true
  primary_language    = "en"
  supported_languages = [
    "en",
    "zh",
    "hi",
    "es",
    "ar",
    "fr",
    "pt",
    "ru",
    "de",
    "ja",
    "ko",
    "it",
    "nl"
  ]
  supported_devices   = ["none"]
  realtime            = true
